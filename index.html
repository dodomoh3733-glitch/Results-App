<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام إدارة النتائج</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="text-center mb-4">نظام إدارة النتائج</h1>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">إضافة طالب</h2>
        <div class="row g-3">
          <div class="col-12 col-md-6 col-lg-4">
            <label for="studentName" class="form-label">اسم الطالب</label>
            <input type="text" id="studentName" class="form-control" placeholder="أدخل الاسم">
          </div>
          <div class="col-6 col-md-3 col-lg-2">
            <label for="grade1" class="form-label">المادة 1</label>
            <input type="number" id="grade1" class="form-control" placeholder="0 - 100">
          </div>
          <div class="col-6 col-md-3 col-lg-2">
            <label for="grade2" class="form-label">المادة 2</label>
            <input type="number" id="grade2" class="form-control" placeholder="0 - 100">
          </div>
          <div class="col-6 col-md-3 col-lg-2">
            <label for="grade3" class="form-label">المادة 3</label>
            <input type="number" id="grade3" class="form-control" placeholder="0 - 100">
          </div>
          <div class="col-6 col-md-3 col-lg-2">
            <label for="attendance" class="form-label">نسبة الحضور %</label>
            <input type="number" id="attendance" class="form-control" placeholder="0 - 100">
          </div>
        </div>
        <div class="mt-3 d-flex flex-wrap gap-2">
          <button id="addBtn" class="btn btn-primary">إضافة طالب</button>
          <button id="mercyBtn" class="btn btn-warning">تفعيل لجنة الرأفة</button>
        </div>
      </div>
    </div>

    <div id="errorBox" class="text-danger fw-bold mb-3" role="alert"></div>

    <div class="row g-4">
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header">قائمة الطلاب</div>
          <div class="card-body"><div id="studentsBox" class="text-muted">لا يوجد طلاب بعد.</div></div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header">التقرير النهائي للجنة الرأفة</div>
          <div class="card-body"><div id="reportBox" class="text-muted">لم يتم تفعيل اللجنة بعد.</div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
